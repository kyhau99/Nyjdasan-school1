name: Update Kumsung calendar
on:
  schedule:
    - cron: "30 21 * * *"   # 매일 오전 6시 30분(한국 시간)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch calendar
        run: node scripts/fetch-kumsung.mjs
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add kumsung.json
          if ! git diff --cached --quiet; then
            git commit -m "update kumsung calendar"
            git push
          fi

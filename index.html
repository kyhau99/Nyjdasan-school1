<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>다산고 학교일정·급식</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="다산고">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f6f8">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%231d2b4a'/%3E%3Ctext x='90' y='118' font-size='88' text-anchor='middle' fill='%23fff' font-family='sans-serif' font-weight='700'%3E다산%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --ink:#1d2b4a; --sub:#6b7488; --line:#e3e6ec;
  --accent:#0e8f7e; --accent-soft:#dff3ef; --warm:#c9811a; --warm-soft:#fbeed7;
  --today:#1d2b4a; --today-ink:#fff;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10141c; --card:#1a2030; --ink:#eef1f7; --sub:#9aa3b8; --line:#2a3246;
    --accent:#3cc4af; --accent-soft:#16332f; --warm:#f0b559; --warm-soft:#3a2e17;
    --today:#eef1f7; --today-ink:#10141c;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:16px;line-height:1.5;overscroll-behavior:none}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-top:env(safe-area-inset-top,0px)}
header{padding:10px 20px 6px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.02em}
header small{display:block;color:var(--sub);font-size:12px;font-weight:500}
.icon{width:40px;height:40px;border-radius:12px;border:0;background:var(--card);color:var(--ink);font-size:20px}
.month{display:flex;align-items:center;justify-content:center;gap:18px;padding:4px 20px 10px}
.month button{width:44px;height:44px;border:0;border-radius:50%;background:var(--card);color:var(--ink);font-size:18px}
.month b{font-size:18px;min-width:120px;text-align:center}
main{flex:1;overflow-y:auto;padding:0 16px 16px;-webkit-overflow-scrolling:touch}
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 4px 12px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.day{flex:0 0 52px;height:68px;border:0;border-radius:16px;background:var(--card);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:inherit}
.day span{font-size:12px;color:var(--sub)}
.day b{font-size:18px}
.day.has b::after{content:"";display:block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin:2px auto 0}
.day.sel{background:var(--today);color:var(--today-ink)}
.day.sel span{color:inherit;opacity:.75}
.day.sat span,.day.sat b{color:#3a79d8}.day.sun span,.day.sun b{color:#d8483a}
.day.sel span,.day.sel b{color:var(--today-ink)}
.meal{background:var(--card);border-radius:20px;padding:16px 18px;margin-bottom:12px}
.meal h3{margin:0 0 8px;font-size:15px;color:var(--accent);display:flex;justify-content:space-between}
.meal h3 em{font-style:normal;color:var(--sub);font-weight:500;font-size:12px}
.meal ul{list-style:none;margin:0;padding:0}
.meal li{padding:5px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.meal li:first-child{border-top:0}
.meal li i{font-style:normal;color:var(--sub);font-size:12px;white-space:nowrap;padding-top:3px}
.ev{display:flex;gap:14px;background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:10px}
.ev.today{outline:2px solid var(--accent)}
.ev .d{flex:0 0 44px;text-align:center;line-height:1.2}
.ev .d b{display:block;font-size:22px}
.ev .d span{font-size:12px;color:var(--sub)}
.ev p{margin:0;align-self:center;font-weight:600}
.ev p small{display:block;color:var(--sub);font-weight:400}
.empty,.err,.note{text-align:center;color:var(--sub);padding:36px 16px}
.err{color:#d8483a}
.note{background:var(--warm-soft);color:var(--warm);border-radius:14px;padding:10px 14px;margin:0 0 12px;font-size:13px;text-align:left}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 12px calc(env(safe-area-inset-bottom,0px) + 6px)}
nav button{flex:1;border:0;background:none;color:var(--sub);font:inherit;font-size:12px;padding:6px 0;border-radius:12px;min-height:50px}
nav button span{display:block;font-size:22px;line-height:1.1}
nav button.on{color:var(--accent);font-weight:700}
dialog{border:0;border-radius:22px;padding:22px;width:calc(100% - 32px);max-width:420px;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog label{display:block;font-size:13px;color:var(--sub);margin:14px 0 6px}
dialog input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;font-size:16px}
dialog p{font-size:13px;color:var(--sub);margin:8px 0 0}
.row{display:flex;gap:10px;margin-top:18px}
.row button{flex:1;height:46px;border-radius:12px;border:0;font:inherit;font-weight:700;background:var(--bg);color:var(--ink)}
.row .pri{background:var(--accent);color:#fff}
.big{padding:4px 6px 14px;display:flex;align-items:baseline;gap:10px}
.big b{font-size:34px;letter-spacing:-.03em}.big span{color:var(--sub);font-size:18px}
.meal li.hot,.meal li.hot i{color:#d8483a;font-weight:700}
.wk{padding:12px 16px}.wk li{padding:3px 0}.wk.cur{outline:2px solid var(--accent)}.wk .sub{color:var(--sub);font-size:14px}
#chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 11px;font:inherit;font-size:13px;min-height:34px}
.chip.on{background:#d8483a;border-color:#d8483a;color:#fff}
dialog{max-height:calc(100% - 48px);overflow:auto}
.now{background:var(--accent);color:var(--bg);border-radius:20px;padding:16px 18px;margin-bottom:10px}
.now small{display:block;opacity:.85;font-size:13px}.now b{font-size:24px}.now b span{font-size:16px;font-weight:500;opacity:.9}
.now.nx{background:var(--card);color:var(--ink)}.now.nx small{color:var(--sub);opacity:1}
.tt{display:grid;grid-template-columns:36px repeat(5,1fr);gap:5px;margin:14px 0 10px}
.th{text-align:center;font-size:13px;font-weight:700;color:var(--sub);padding:4px 0}.th.tod{color:var(--accent)}
.pn{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:var(--sub);line-height:1.2}.pn b{font-size:15px;color:var(--ink)}
.cell{border:0;border-radius:12px;min-height:60px;padding:4px 2px;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:hsl(var(--h) 55% 50% / .16);color:var(--ink);min-width:0}
.cell b{font-size:12px;line-height:1.25;overflow-wrap:anywhere}.cell span{font-size:11px;color:var(--sub)}
.cell.nil{background:var(--card)}.cell.tod{outline:1.5px solid var(--line)}.cell.live{outline:2.5px solid var(--accent)}
.hint{color:var(--sub);font-size:13px;text-align:center;margin:6px 0 12px}
.row2{display:flex;gap:10px}.row2 button{flex:1;height:44px;border:0;border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
</style>
</head>
<body>
<div id="app">
  <header>
    <div><h1 id="title">남양주다산고등학교</h1><small>경기도교육청 · 나이스 교육정보 개방 포털</small></div>
    <button class="icon" id="gear" aria-label="설정">⚙︎</button>
  </header>
  <div class="month" id="monthbar">
    <button id="prev" aria-label="이전 달">‹</button><b id="ym"></b><button id="next" aria-label="다음 달">›</button>
  </div>
  <main id="main"></main>
  <nav>
    <button id="t-today"><span>📍</span>오늘</button>
    <button id="t-meal"><span>🍚</span>급식</button>
    <button id="t-week"><span>🗓️</span>주간</button>
    <button id="t-sch"><span>📅</span>일정</button>
    <button id="t-tt"><span>🧑‍🏫</span>시간표</button>
  </nav>
</div>

<dialog id="dlg">
  <h2 style="margin:0;font-size:18px">설정</h2>
  <label for="f-name">학교 이름</label>
  <input id="f-name" autocomplete="off">
  <label for="f-key">인증키 (선택)</label>
  <input id="f-key" autocomplete="off" placeholder="open.neis.go.kr 에서 발급">
  <p>인증키가 없으면 한 번에 5건만 조회됩니다. 무료 발급 후 입력하면 한 달 전체가 표시됩니다. 키는 이 기기에만 저장됩니다.</p>
  <label for="f-teacher">시간표 이름</label>
  <input id="f-teacher" autocomplete="off">
  <label for="f-times">교시별 시작 시각 (쉼표로 구분)</label>
  <input id="f-times" autocomplete="off">
  <label for="f-len">수업 시간 (분)</label>
  <input id="f-len" inputmode="numeric">
  <label>피할 알레르기 (해당 메뉴를 빨갛게 표시)</label>
  <div id="chips"></div>
  <div class="row"><button id="cancel">닫기</button><button class="pri" id="save">저장</button></div>
</dialog>

<dialog id="cdlg">
  <h2 id="c-title" style="margin:0;font-size:18px"></h2>
  <label for="c-s">과목</label>
  <input id="c-s" autocomplete="off" placeholder="짧게 쓰면 보기 좋아요 (예: AI수학)">
  <label for="c-c">학급</label>
  <input id="c-c" autocomplete="off" placeholder="예: 2-3">
  <div class="row"><button id="c-del">비우기</button><button id="c-cancel">닫기</button><button class="pri" id="c-save">저장</button></div>
</dialog>

<script>
const OFFICE = "J10"; // 경기도교육청
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
};
let cfg = { name: store.get("name", "남양주다산고등학교"), key: store.get("key", ""), avoid: (() => { try { return JSON.parse(store.get("avoid", "[]")); } catch(e){ return []; } })(), code: store.get("code", ""), codeName: store.get("codeName", "") };
cfg.teacher = store.get("teacher", "금유호");
cfg.times = store.get("times", "08:50,09:50,10:50,11:50,13:40,14:40,15:40").split(",");
cfg.len = +store.get("len", "50") || 50;
cfg.tt = (() => { try { return JSON.parse(store.get("tt", "{}")); } catch(e){ return {}; } })();
const now = new Date();
const S = { tab: "today", loaded: "", y: now.getFullYear(), m: now.getMonth() + 1, sel: ymd(now), meals: {}, events: {}, loading: false, error: "" };
const $ = id => document.getElementById(id);
const DOW = ["일","월","화","수","목","금","토"];
const ALLERGENS = ["난류","우유","메밀","땅콩","대두","밀","고등어","게","새우","돼지고기","복숭아","토마토","아황산류","호두","닭고기","쇠고기","오징어","조개류","잣"];
const pd = k => new Date(+k.slice(0,4), +k.slice(4,6)-1, +k.slice(6,8));
function weekMon(){ const d = pd(S.sel); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d; }
function weekRange(){ const a = weekMon(), b = new Date(a); b.setDate(a.getDate() + 6); return [ymd(a), ymd(b)]; }

function ymd(d){ return d.getFullYear() + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0"); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

async function api(name, params){
  const q = new URLSearchParams({ Type: "json", pIndex: 1, pSize: cfg.key ? 1000 : 5, ...params });
  if (cfg.key) q.set("KEY", cfg.key);
  const r = await fetch("https://open.neis.go.kr/hub/" + name + "?" + q);
  const j = await r.json();
  if (j[name]) return j[name][1].row || [];
  const code = j.RESULT && j.RESULT.CODE;
  if (code === "INFO-200") return [];
  throw new Error((j.RESULT && j.RESULT.MESSAGE) || "조회에 실패했어요.");
}

async function ensureSchool(){
  if (cfg.code && cfg.codeName === cfg.name) return;
  const rows = await api("schoolInfo", { ATPT_OFCDC_SC_CODE: OFFICE, SCHUL_NM: cfg.name });
  if (!rows.length) throw new Error("‘" + cfg.name + "’을(를) 경기도교육청 소속 학교에서 찾지 못했어요. 설정에서 학교 이름을 확인해 주세요.");
  cfg.code = rows[0].SD_SCHUL_CODE; cfg.codeName = cfg.name;
  store.set("code", cfg.code); store.set("codeName", cfg.codeName);
}

async function load(){
  S.loading = true; S.error = ""; render();
  const last = new Date(S.y, S.m, 0).getDate();
  const ym = S.y + String(S.m).padStart(2, "0");
  const base = { ATPT_OFCDC_SC_CODE: OFFICE };
  try {
    await ensureSchool();
    base.SD_SCHUL_CODE = cfg.code;
    const [meals, events] = await Promise.all([
      api("mealServiceDietInfo", { ...base, MLSV_FROM_YMD: ym + "01", MLSV_TO_YMD: ym + String(last).padStart(2,"0") }),
      api("SchoolSchedule", { ...base, AA_FROM_YMD: ym + "01", AA_TO_YMD: ym + String(last).padStart(2,"0") })
    ]);
    S.meals = {}; S.events = {};
    meals.forEach(r => (S.meals[r.MLSV_YMD] = S.meals[r.MLSV_YMD] || []).push(r));
    events.forEach(r => (S.events[r.AA_YMD] = S.events[r.AA_YMD] || []).push(r));
    S.loaded = ym;
    if (S.tab === "week"){
      const [a, b] = weekRange();
      const wk = await api("mealServiceDietInfo", { ...base, MLSV_FROM_YMD: a, MLSV_TO_YMD: b });
      const g = {}; wk.forEach(r => (g[r.MLSV_YMD] = g[r.MLSV_YMD] || []).push(r));
      Object.assign(S.meals, g);
    }
    const first = ym + "01";
    if (!S.sel.startsWith(ym)) S.sel = (S.y === now.getFullYear() && S.m === now.getMonth()+1) ? ymd(now) : first;
  } catch(e){
    S.error = e.message === "Failed to fetch" ? "인터넷에 연결되어 있는지 확인한 뒤 다시 시도해 주세요." : e.message;
  }
  S.loading = false; render();
}

function dishes(txt){
  return txt.split(/<br\s*\/?>/i).map(s => s.trim()).filter(Boolean).map(s => {
    const m = s.match(/^(.*?)\s*\(([\d.]+)\)\s*$/);
    return m ? { n: m[1], a: m[2].split(".") } : { n: s, a: [] };
  });
}

function dishLi(x){
  const hit = x.a.some(c => cfg.avoid.includes(c));
  return `<li${hit ? ' class="hot"' : ""}><span>${esc(x.n)}</span>${x.a.length ? `<i>${hit ? "⚠ " : ""}알레르기 ${x.a.join("·")}</i>` : ""}</li>`;
}
function mealCard(r){
  return `<section class="meal"><h3>${esc(r.MMEAL_SC_NM)}<em>${r.CAL_INFO ? esc(r.CAL_INFO) : ""}</em></h3><ul>${dishes(r.DDISH_NM).map(dishLi).join("")}</ul></section>`;
}
const toMin = x => { const [h, m] = x.split(":"); return +h * 60 + +m; };
const fmt = m => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
const hue = t => { let h = 0; for (const ch of t) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; };
function curPeriod(){
  const t = new Date(), mins = t.getHours() * 60 + t.getMinutes(), d = t.getDay();
  const st = cfg.times.map(toMin);
  return { d, mins, st, cur: d >= 1 && d <= 5 ? st.findIndex(x => mins >= x && mins < x + cfg.len) : -1 };
}
function ttCard(){
  const { d, mins, st, cur } = curPeriod();
  if (d < 1 || d > 5) return '<div class="now"><small>오늘</small><b>수업이 없는 날이에요</b></div>';
  const lbl = i => { const c = cellAt(d + "-" + (i + 1)); return c && c.s ? esc(c.s) + (c.c ? ` <span>${esc(c.c)}</span>` : "") : "공강"; };
  let h = "";
  if (cur >= 0) h += `<div class="now"><small>지금 · ${cur+1}교시 ${fmt(st[cur])}–${fmt(st[cur]+cfg.len)}</small><b>${lbl(cur)}</b></div>`;
  const nx = st.findIndex((x, i) => x > mins && cellAt(d + "-" + (i + 1)) && cellAt(d + "-" + (i + 1)).s);
  if (nx >= 0) h += `<div class="now nx"><small>다음 · ${nx+1}교시 ${fmt(st[nx])} (${st[nx]-mins}분 뒤)</small><b>${lbl(nx)}</b></div>`;
  else if (cur < 0) h = '<div class="now"><small>오늘</small><b>남은 수업이 없어요</b></div>';
  return h;
}
function renderTT(){
  const { d: td, cur } = curPeriod();
  let h = `<div class="big"><b>${esc(cfg.teacher)} 시간표</b></div>` + ttCard();
  h += '<div class="tt"><div></div>' + [1,2,3,4,5].map(d => `<div class="th${d === td ? " tod" : ""}">${DOW[d]}</div>`).join("");
  cfg.times.forEach((tm, i) => {
    h += `<div class="pn"><b>${i+1}</b>${esc(tm)}</div>`;
    for (let d = 1; d <= 5; d++){
      const c = cellAt(d + "-" + (i + 1)), has = c && c.s;
      h += `<button class="cell${has ? "" : " nil"}${d === td ? " tod" : ""}${d === td && i === cur ? " live" : ""}" data-k="${d}-${i+1}"${has ? ` style="--h:${hue(c.s)}"` : ""}>${has ? `<b>${esc(c.s)}</b><span>${esc(c.c || "")}</span>` : ""}</button>`;
    }
  });
  return h + '</div><p class="hint">' + (auto ? "컴시간 연동 · " + autoTime() + " 업데이트<br>" : "") + '칸을 누르면 과목과 학급을 직접 입력할 수 있어요. 직접 입력한 칸이 연동 값보다 우선해요.</p><div class="row2"><button id="bk-out">백업 복사</button><button id="bk-in">백업 붙여넣기</button></div>';
}
function renderToday(){
  const k = ymd(now), list = S.meals[k] || [], ev = S.events[k] || [];
  let h = `<div class="big"><b>${now.getMonth()+1}월 ${now.getDate()}일</b><span>${DOW[now.getDay()]}요일</span></div>`;
  if (S.loading) return h + '<div class="empty">불러오는 중…</div>';
  const hits = list.reduce((n, r) => n + dishes(r.DDISH_NM).filter(x => x.a.some(c => cfg.avoid.includes(c))).length, 0);
  if (hits) h += `<div class="note">피하려는 알레르기가 들어간 메뉴가 ${hits}개 있어요. ⚠ 표시를 확인하세요.</div>`;
  h += ev.map(r => `<div class="ev today"><div class="d"><b>📌</b></div><p>${esc(r.EVENT_NM)}</p></div>`).join("");
  h += list.length ? list.map(mealCard).join("") : '<div class="empty">오늘은 급식 정보가 없어요.</div>';
  return h;
}
function renderWeek(){
  if (S.loading) return '<div class="empty">불러오는 중…</div>';
  const mon = weekMon(), today = ymd(now);
  let h = "";
  for (let i = 0; i < 5; i++){
    const d = new Date(mon); d.setDate(mon.getDate() + i);
    const k = ymd(d), list = S.meals[k];
    const r = list && (list.find(x => x.MMEAL_SC_NM === "중식") || list[0]);
    h += `<section class="meal wk${k === today ? " cur" : ""}"><h3>${d.getMonth()+1}/${d.getDate()} (${DOW[d.getDay()]})<em>${r ? esc(r.MMEAL_SC_NM) : ""}</em></h3>` + (r ? `<ul>${dishes(r.DDISH_NM).map(dishLi).join("")}</ul>` : '<div class="sub">급식 정보 없음</div>') + "</section>";
  }
  return h;
}
function renderMeal(){
  const days = new Date(S.y, S.m, 0).getDate(), ym = S.y + String(S.m).padStart(2,"0");
  let strip = '<div class="strip" id="strip">';
  for (let d = 1; d <= days; d++){
    const k = ym + String(d).padStart(2,"0"), w = new Date(S.y, S.m-1, d).getDay();
    strip += `<button class="day${k===S.sel?" sel":""}${S.meals[k]?" has":""}${w===6?" sat":""}${w===0?" sun":""}" data-d="${k}"><span>${DOW[w]}</span><b>${d}</b></button>`;
  }
  strip += "</div>";
  const list = S.meals[S.sel];
  let body = "";
  if (S.loading) body = '<div class="empty">불러오는 중…</div>';
  else if (!list) body = '<div class="empty">이 날은 급식 정보가 없어요.<br>주말이나 방학, 시험 기간일 수 있어요.</div>';
  else body = list.map(mealCard).join("");
  return strip + body;
}

function renderSch(){
  if (S.loading) return '<div class="empty">불러오는 중…</div>';
  const keys = Object.keys(S.events).sort();
  if (!keys.length) return '<div class="empty">이번 달에는 등록된 학사일정이 없어요.</div>';
  const today = ymd(now);
  return keys.map(k => {
    const w = new Date(+k.slice(0,4), +k.slice(4,6)-1, +k.slice(6,8)).getDay();
    return S.events[k].map(r => `<div class="ev${k===today?" today":""}"><div class="d"><b>${+k.slice(6,8)}</b><span>${DOW[w]}요일</span></div><p>${esc(r.EVENT_NM)}${r.EVENT_CNTNT ? `<small>${esc(r.EVENT_CNTNT)}</small>` : ""}</p></div>`).join("");
  }).join("");
}

function render(){
  $("ym").textContent = S.y + "년 " + S.m + "월";
  $("title").textContent = cfg.name;
  ["today","meal","week","sch","tt"].forEach(t => $("t-" + t).className = S.tab === t ? "on" : "");
  $("monthbar").style.display = S.tab === "today" || S.tab === "tt" ? "none" : "";
  if (S.tab === "week"){ const [a, b] = weekRange(); $("ym").textContent = `${+a.slice(4,6)}.${+a.slice(6)} – ${+b.slice(4,6)}.${+b.slice(6)}`; }
  let html = "";
  if (S.tab === "tt") html += renderTT();
  else if (S.error) html += `<div class="err">${esc(S.error)}</div>`;
  else {
    if (!cfg.key) html += '<div class="note">인증키 없이 샘플 모드로 조회 중이라 5건까지만 표시돼요. 설정(⚙︎)에서 인증키를 입력해 주세요.</div>';
    html += ({ today: renderToday, meal: renderMeal, week: renderWeek, sch: renderSch })[S.tab]();
  }
  const main = $("main"), st = main.scrollTop;
  main.innerHTML = html; main.scrollTop = st;
  const sel = main.querySelector(".day.sel");
  if (sel) sel.scrollIntoView({ inline: "center", block: "nearest" });
}

$("main").addEventListener("click", e => {
  const b = e.target.closest(".day"); if (b){ S.sel = b.dataset.d; render(); }
});
["today","meal","week","sch","tt"].forEach(t => $("t-" + t).onclick = () => setTab(t));
function setTab(t){
  S.tab = t;
  if (t === "today"){ S.y = now.getFullYear(); S.m = now.getMonth() + 1; S.sel = ymd(now); }
  if (t === "tt"){ render(); return; }
  if (t === "week" || S.loaded !== S.y + String(S.m).padStart(2, "0")) load(); else render();
}
function shift(n){
  let d;
  if (S.tab === "week"){ d = pd(S.sel); d.setDate(d.getDate() + 7 * n); }
  else d = new Date(S.y, S.m - 1 + n, 1);
  S.y = d.getFullYear(); S.m = d.getMonth() + 1; S.sel = ymd(d); load();
}
let auto = null;
const cellAt = k => cfg.tt[k] || (auto && auto.cells && auto.cells[k]) || null;
function autoTime(){ const t = new Date(auto.updated); return `${t.getMonth()+1}월 ${t.getDate()}일 ${fmt(t.getHours() * 60 + t.getMinutes())}`; }
async function loadAuto(){
  try {
    const r = await fetch("timetable.json?ts=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return;
    const j = await r.json();
    if (j && j.cells && Object.keys(j.cells).length){ auto = j; if (S.tab === "tt") render(); }
  } catch(e){}
}
loadAuto();
let editing = "";
function persist(){ store.set("tt", JSON.stringify(cfg.tt)); $("cdlg").close(); render(); }
$("main").addEventListener("click", e => {
  const c = e.target.closest(".cell");
  if (c){
    editing = c.dataset.k; const [d, p] = editing.split("-"), v = cellAt(editing) || {};
    $("c-title").textContent = DOW[d] + "요일 " + p + "교시";
    $("c-s").value = v.s || ""; $("c-c").value = v.c || ""; $("cdlg").showModal(); return;
  }
  if (e.target.id === "bk-out"){
    const txt = JSON.stringify(cfg.tt);
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => alert("시간표를 복사했어요. 메모 앱에 붙여넣어 보관하세요."), () => prompt("아래 내용을 복사하세요", txt));
  }
  if (e.target.id === "bk-in"){
    const t = prompt("복사해 둔 시간표를 붙여넣으세요");
    if (t){ try { const o = JSON.parse(t); if (o && typeof o === "object"){ cfg.tt = o; store.set("tt", JSON.stringify(o)); render(); } } catch(err){ alert("형식이 올바르지 않아요."); } }
  }
});
$("c-save").onclick = () => { const v = $("c-s").value.trim(); if (v) cfg.tt[editing] = { s: v, c: $("c-c").value.trim() }; else delete cfg.tt[editing]; persist(); };
$("c-del").onclick = () => { delete cfg.tt[editing]; persist(); };
$("c-cancel").onclick = () => $("cdlg").close();
setInterval(() => { if (S.tab === "tt" && !$("cdlg").open && !$("dlg").open) render(); }, 30000);
$("chips").addEventListener("click", e => { const b = e.target.closest(".chip"); if (b) b.classList.toggle("on"); });
$("prev").onclick = () => shift(-1);
$("next").onclick = () => shift(1);
$("gear").onclick = () => {
  $("f-name").value = cfg.name; $("f-key").value = cfg.key;
  $("f-teacher").value = cfg.teacher; $("f-times").value = cfg.times.join(","); $("f-len").value = cfg.len;
  $("chips").innerHTML = ALLERGENS.map((n, i) => `<button type="button" class="chip${cfg.avoid.includes(String(i+1)) ? " on" : ""}" data-c="${i+1}">${n}</button>`).join("");
  $("dlg").showModal();
};
$("cancel").onclick = () => $("dlg").close();
$("save").onclick = () => {
  cfg.name = $("f-name").value.trim() || "남양주다산고등학교"; cfg.key = $("f-key").value.trim();
  store.set("name", cfg.name); store.set("key", cfg.key);
  cfg.avoid = [...document.querySelectorAll("#chips .on")].map(b => b.dataset.c); store.set("avoid", JSON.stringify(cfg.avoid));
  cfg.teacher = $("f-teacher").value.trim() || "금유호"; store.set("teacher", cfg.teacher);
  const tm = $("f-times").value.split(",").map(x => x.trim()).filter(x => /^\d{1,2}:\d{2}$/.test(x));
  if (tm.length){ cfg.times = tm; store.set("times", tm.join(",")); }
  cfg.len = Math.max(10, +$("f-len").value || 50); store.set("len", String(cfg.len));
  $("dlg").close(); load();
};
load();
</script>
</body>
</html>

name: Update timetable
on:
  schedule:
    - cron: "0 21 * * 0-4"   # 월~금 오전 6시(한국 시간)
    - cron: "0 3 * * 1-5"    # 월~금 정오(한국 시간)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch timetable
        run: node scripts/fetch-timetable.mjs
        env:
          SCHOOL_QUERY: 남양주다산
          TEACHER: 금유호
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add timetable.json
          if ! git diff --cached --quiet; then
            git commit -m "update timetable"
            git push
          fi
